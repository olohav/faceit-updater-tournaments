/* ---------- Вспомогательные функции ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const parseDate = (d, endOfDay) => new Date(d + (endOfDay ? "T23:59:59" : "T00:00:00"));
const toRub = m => m ? m.v * (m.c === "USD" ? USD_RUB : 1) : 0;
const fmt = n => n.toLocaleString("ru-RU");
const money = m => !m ? "не указан" : m.v === 0 ? "бесплатно" : (m.c === "USD" ? "$" + fmt(m.v) : fmt(m.v) + " ₽");
const fd = (d, y) => parseDate(d).toLocaleDateString("ru-RU", { day:"numeric", month:"long", ...(y ? { year:"numeric" } : {}) });
const hm = t => t.startsAt ? ", " + t.startsAt.slice(11, 16) + " МСК" : "";   // время старта по Москве (GMT+3)
const dates = t => t.tba ? "Даты не объявлены или не найдены"
  : t.endUnknown ? "с " + fd(t.start, true) + hm(t) + " · окончание не указано"
  : t.start === t.end ? fd(t.start, true) + hm(t)
  : fd(t.start, t.start.slice(0, 4) !== t.end.slice(0, 4)) + hm(t) + " — " + fd(t.end, true);
/* Подпись про регистрацию: «Регистрация до 5 декабря 2026 г., 16:30 МСК» или «Регистрация закрыта». */
const regLine = t => {
  if (!t.regEnd) return "";
  const hasTime = t.regEnd.includes("T"), d = t.regEnd.slice(0, 10);
  if (new Date(hasTime ? t.regEnd : d + "T23:59:59+03:00") < new Date()) return "Регистрация закрыта";
  return "Регистрация до " + fd(d, true) + (hasTime ? ", " + t.regEnd.slice(11, 16) + " МСК" : "");
};

/* Статус по дате: идёт / чек-ин (за 3 дня до старта) / скоро. null — турнир окончен или дальше 365 дней. */
function statusOf(t, now = new Date()) {
  if (t.tba) return { k:"soon", l:"Даты уточняются" };   // сезон анонсирован, дат ещё нет
  const s = parseDate(t.start), e = parseDate(t.end, true);
  if (e < now || s - now > 365 * DAY) return null;
  if (s <= now) return { k:"live", l:"Турнир идёт" };
  if (s - now <= 3 * DAY) return { k:"checkin", l:"Чек-ин" };
  return { k:"soon", l:"Скоро: " + Math.ceil((s - now) / DAY) + " дн." };
}

/* Актуальные турниры: завершённые автоматически исчезают из списков. */
/* Склейка ручных данных и автозагрузки: ручные записи FACEIT, дублирующие автоматические (тот же UUID в ссылке), отбрасываются. */
const allTournaments = () => {
  const uuid = u => ((u || "").match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i) || [""])[0].toLowerCase();
  const auto = new Set(REMOTE.map(t => uuid(t.site)).filter(Boolean));
  const ids = new Set();
  return [...TOURNAMENTS.filter(t => !auto.has(uuid(t.site))), ...REMOTE, ...MANUAL].filter(t => !ids.has(t.id) && ids.add(t.id));
};
const activeList = () => allTournaments().map(t => ({ team:"5x5", platform:"Не указана", ru:true, ...t, kind: t.kind || (/qualif|квалиф/i.test(t.name) ? "qualifier" : "main"), st: statusOf(t) })).filter(t => t.st && !t.own && !t.fp)
  .sort((a, b) => (a.tba ? 9e15 : +parseDate(a.start)) - (b.tba ? 9e15 : +parseDate(b.start)));

/* Показывает всплывающее уведомление вместо alert/перезагрузки. */
function toast(title, text, type = "ok") {
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.innerHTML = "<b></b><span></span>";
  el.firstChild.textContent = title; el.lastChild.textContent = text;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), 4500);
}

/* Проверка email: что-то@домен.зона без пробелов. */
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());

/* Подключает валидацию к форме; при успехе вызывает onOk и очищает форму без перезагрузки. */
function bindForm(form, onOk) {
  form.addEventListener("submit", e => {
    e.preventDefault();
    let ok = true;
    $$(".field", form).forEach(f => {
      const i = $("input,textarea", f), v = i.value.trim();
      let msg = "";
      if (!v) msg = "Заполните поле";
      else if (i.type === "email" && !validEmail(v)) msg = "Введите корректный email, например name@mail.ru";
      f.classList.toggle("bad", !!msg); $(".err", f).textContent = msg;
      if (msg) ok = false;
    });
    if (!ok) return toast("Форма не отправлена", "Проверьте выделенные поля.", "fail");
    const r = onOk(Object.fromEntries(new FormData(form)));
    if (r && r.then) r.then(ok => { if (ok !== false) form.reset(); });   // при ошибке отправки текст остаётся в форме
    else form.reset();
  });
}

/* Генерирует HTML поля формы. */
const field = (name, label, type = "text", area = false) =>
  `<div class="field"><label for="${name}">${label}</label>${area ? `<textarea id="${name}" name="${name}" rows="4"></textarea>` : `<input id="${name}" name="${name}" type="${type}" autocomplete="off">`}<div class="err"></div></div>`;

/* Карточка-строка турнира в списке. */
const row = t => `<a class="t-row" href="#/t/${t.id}">
  <div><h3>${t.name}</h3>
  <div class="meta">${dates(t)} · ${t.city}</div>
  ${t.regEnd ? `<div class="meta"><b>${regLine(t)}</b></div>` : ""}
  <div class="tags"><span class="st ${t.st.k}">${t.st.l}</span><span class="tag">${t.disc}</span><span class="tag">${t.team}</span><span class="tag">${t.format}</span>${t.student ? `<span class="tag">Студенческая лига</span>` : ""}${t.kind === "qualifier" ? `<span class="tag">Квалификация</span>` : ""}<span class="tag">${t.op}</span></div></div>
  <div><div class="prize">${money(t.prize)}</div>${t.prize && t.prize.c === "USD" ? `<div class="meta" style="text-align:right">≈ ${fmt(toRub(t.prize))} ₽</div>` : ""}<div class="meta" style="text-align:right">взнос: ${money(t.fee)}</div></div></a>`;

/* ---------- Страница 1: поиск и фильтры ---------- */
function pageHome() {
  const all = activeList();
  const discs = ["CS2", "Dota 2", "Valorant", "MLBB"];              // порядок групп на странице
  const ops = [...new Set(all.map(t => t.op))];
  const SL = { prize: 10000, fee: 100 };                             // ползунки и их шаг, ₽
  const f = { q:"", d:new Set(), o:new Set(), m:new Set(), p:new Set(), stu:false, qual:false, ru:false, prize:[0, 0], fee:[0, 0] };
  const openG = new Set();                                           // раскрытые группы турниров

  /* Выпадающий список фильтра: заголовок со счётчиком выбранных и чекбоксы внутри. */
  const dd = (key, title, body) => `<details class="dd"><summary>${title}<em data-c="${key}"></em></summary><div class="dd-body">${body}</div></details>`;
  const chk = (attr, v, label = v) => `<label class="chk"><input type="checkbox" data-${attr}="${v}"> ${label}</label>`;
  /* Отдельные ползунки «от» и «до». */
  const rng = (id, title) => `<fieldset><legend>${title}</legend><div class="rng"><label>от <input type="range" id="${id}min" min="0" step="${SL[id]}" value="0"></label><label>до <input type="range" id="${id}max" min="0" step="${SL[id]}"></label></div><div class="range-val" id="${id}V"></div></fieldset>`;

  $("#app").innerHTML = `<h1>Турниры по киберспорту в России</h1>
  <p class="lead">CS2, Dota 2, Valorant и MLBB: LAN и онлайн, форматы 1x1, 2x2, 5x5 и студенческие лиги. Завершённые турниры скрываются автоматически.</p>
  <div class="layout"><aside class="card filters" aria-label="Фильтры">
    <fieldset><legend>Поиск</legend><input type="search" id="q" placeholder="Турнир или оператор"></fieldset>
    ${dd("d", "Дисциплина", discs.map(d => chk("d", d, d === "MLBB" ? "MLBB (Mobile Legends: Bang Bang)" : d)).join(""))}
    ${dd("m", "Формат матчей", ["1x1", "2x2", "5x5"].map(m => chk("m", m)).join(""))}
    ${dd("t", "Тип", `<label class="chk"><input type="checkbox" id="stu"> Только студенческие лиги</label><label class="chk"><input type="checkbox" id="qual"> Только квалификации</label><label class="chk"><input type="checkbox" id="ru"> С российским фокусом (русскоязычные и из РФ)</label>`)}
    ${dd("p", "Платформа", PLATFORMS.map(p => chk("p", p, `${p} (${all.filter(t => t.platform === p).length})`)).join(""))}
    ${dd("o", "Турнирный оператор", ops.map(o => chk("o", o)).join(""))}
    ${rng("prize", "Призовой фонд")}${rng("fee", "Взнос за участие")}
    <button class="btn ghost" type="button" id="reset">Сбросить</button>
  </aside><section><div class="meta" id="count" style="margin-bottom:.6rem"></div><div id="list"></div></section></div>`;

  /* Границы и подписи пары ползунков; `moved` — какой двигали (он не может перескочить соседа). */
  function slider(id, reset, moved) {
    const base = all.filter(t => !f.d.size || f.d.has(t.disc));
    const mx = Math.ceil(Math.max(0, ...base.map(t => toRub(t[id]))) / SL[id]) * SL[id];
    const lo = $("#" + id + "min"), hi = $("#" + id + "max");
    lo.max = hi.max = mx; lo.disabled = hi.disabled = mx === 0;
    if (reset) { lo.value = 0; hi.value = mx; }
    if (+lo.value > +hi.value) (moved === "min" ? hi : lo).value = (moved === "min" ? lo : hi).value;
    f[id] = [+lo.value, +hi.value];
    $("#" + id + "V").textContent = mx === 0 ? "нет данных" : "от " + fmt(f[id][0]) + " до " + fmt(f[id][1]) + " ₽ (макс. " + fmt(mx) + " ₽)";
  }
  const bounds = reset => Object.keys(SL).forEach(id => slider(id, reset));
  const inRange = (m, [lo, hi]) => { const v = toRub(m); return v >= lo && v <= hi; };

  /* Применяет фильтры и рисует турниры группами по играм (раскрывающиеся списки). */
  function draw() {
    const q = f.q.toLowerCase();
    const res = all.filter(t => (!q || (t.name + " " + t.op).toLowerCase().includes(q)) && (!f.d.size || f.d.has(t.disc)) &&
      (!f.o.size || f.o.has(t.op)) && (!f.m.size || f.m.has(t.team)) && (!f.p.size || f.p.has(t.platform)) && (!f.stu || t.student) &&
      (!f.qual || t.kind === "qualifier") && (!f.ru || t.ru) && inRange(t.prize, f.prize) && (t.fee ? inRange(t.fee, f.fee) : f.fee[0] === 0));
    $("#count").textContent = "Найдено: " + res.length + " из " + all.length;
    const order = d => (discs.includes(d) ? discs.indexOf(d) : 99);
    const games = [...new Set(res.map(t => t.disc))].sort((x, y) => order(x) - order(y));
    $("#list").innerHTML = res.length ? games.map(d => { const g = res.filter(t => t.disc === d);
      return `<details class="grp" data-g="${d}"${openG.has(d) || f.q ? " open" : ""}><summary>${d}<b>${g.length}</b></summary><div class="list">${g.map(row).join("")}</div></details>`; }).join("")
      : `<div class="card empty">Ничего не найдено. Расширьте фильтры или сбросьте их.</div>`;
    $$(".grp").forEach(g => g.ontoggle = () => (g.open ? openG.add(g.dataset.g) : openG.delete(g.dataset.g)));
    $$("[data-c]").forEach(e => { const n = e.dataset.c === "t" ? +f.stu + +f.qual + +f.ru : f[e.dataset.c].size; e.textContent = n ? " · " + n : ""; });
  }
  $("#q").oninput = e => { f.q = e.target.value; draw(); };
  $$("[data-d]").forEach(c => c.onchange = () => { c.checked ? f.d.add(c.dataset.d) : f.d.delete(c.dataset.d); bounds(true); draw(); });
  $$("[data-o]").forEach(c => c.onchange = () => { c.checked ? f.o.add(c.dataset.o) : f.o.delete(c.dataset.o); draw(); });
  $$("[data-m]").forEach(c => c.onchange = () => { c.checked ? f.m.add(c.dataset.m) : f.m.delete(c.dataset.m); draw(); });
  $$("[data-p]").forEach(c => c.onchange = () => { c.checked ? f.p.add(c.dataset.p) : f.p.delete(c.dataset.p); draw(); });
  $("#stu").onchange = e => { f.stu = e.target.checked; draw(); };
  $("#qual").onchange = e => { f.qual = e.target.checked; draw(); };
  $("#ru").onchange = e => { f.ru = e.target.checked; draw(); };
  Object.keys(SL).forEach(id => ["min", "max"].forEach(k => $("#" + id + k).oninput = () => { slider(id, false, k); draw(); }));
  $("#reset").onclick = pageHome;
  bounds(true); draw();
}

/* ---------- Страница: аналитика по актуальным турнирам ---------- */
function pageAnalytics() {
  const all = activeList(), dated = all.filter(t => !t.tba), now = new Date();
  const known = all.filter(t => t.prize), sum = known.reduce((s, t) => s + toRub(t.prize), 0);
  /* Считает турниры по ключу, сортирует по убыванию. */
  const groupBy = (arr, fn) => { const m = new Map(); arr.forEach(t => m.set(fn(t), (m.get(fn(t)) || 0) + 1)); return [...m].sort((a, b) => b[1] - a[1]); };
  /* Рисует горизонтальные столбики из строк [подпись, значение, текст справа]. */
  const bars = rows => { const mx = Math.max(1, ...rows.map(r => r[1])); return rows.map(([l, v, x]) => `<div class="br"><span>${l}</span><div class="tr"><i style="width:${v / mx * 100}%"></i></div><b>${x ?? v}</b></div>`).join(""); };
  const card = (h, body, note = "") => `<div class="card"><h2>${h}</h2>${body}${note ? `<p class="meta">${note}</p>` : ""}</div>`;
  const kpi = (v, l) => `<div class="card kpi"><b>${v}</b><span>${l}</span></div>`;
  const discs = ["CS2", "Valorant", "Dota 2", "MLBB"].map(d => { const a = all.filter(t => t.disc === d); return [d, a.length, a.length + " · " + fmt(a.reduce((s, t) => s + toRub(t.prize), 0)) + " ₽"]; });
  const plats = PLATFORMS.map(p => [p, all.filter(t => t.platform === p).length]);
  const teams = ["1x1", "2x2", "5x5"].map(m => [m, all.filter(t => t.team === m).length]);
  const months = [...Array(12)].map((_, i) => { const s = new Date(now.getFullYear(), now.getMonth() + i, 1), e = new Date(s.getFullYear(), s.getMonth() + 1, 0, 23, 59, 59); return [s.toLocaleDateString("ru-RU", { month:"short", year:"2-digit" }), dated.filter(t => parseDate(t.start) <= e && parseDate(t.end, 1) >= s).length]; });
  const buckets = [["не указан", t => !t.prize], ["до 50 тыс. ₽", t => t.prize && toRub(t.prize) < 5e4], ["50–500 тыс. ₽", t => t.prize && toRub(t.prize) >= 5e4 && toRub(t.prize) < 5e5], ["от 500 тыс. ₽", t => t.prize && toRub(t.prize) >= 5e5]].map(([l, fn]) => [l, all.filter(fn).length]);
  $("#app").innerHTML = `<h1>Аналитика</h1><p class="lead">Сводка по актуальным турнирам из списка. Турниры самих игровых платформ не учитываются — только квалификации и турниры сторонних организаторов.</p>

}

/* ---------- Аккаунты и роли (Supabase) ---------- */
let SB = null;                                  // клиент Supabase (null, пока сервис не подключён)
const AUTH = { user: null, role: null, ready: false };   // role: "user" или "admin"

function initSupabase() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) return false;
  SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return true;
}
/* Роль берётся из таблицы profiles; изменить её может только администратор базы данных. */
async function loadRole() {
  AUTH.role = null;
  if (!SB || !AUTH.user) return;
  const { data } = await SB.from("profiles").select("role").eq("id", AUTH.user.id).maybeSingle();
  AUTH.role = data && data.role === "admin" ? "admin" : "user";
}
const isAdmin = () => AUTH.role === "admin";

/* Блок «Войти / email · роль · Выйти» в шапке. */
function renderAuth() {
  const box = $("#auth");
  box.innerHTML = AUTH.user
    ? `<span class="who" title="${esc(AUTH.user.email)}">${esc(AUTH.user.email)}</span><span class="badge ${isAdmin() ? "admin" : ""}">${isAdmin() ? "Администратор" : "Пользователь"}</span><button class="btn ghost" id="logout" type="button">Выйти</button>`
    : `<a class="btn ghost" href="#/login" style="text-decoration:none">Войти</a>`;
  $("#navAdmin").hidden = !isAdmin();
  const lo = $("#logout"); if (lo) lo.onclick = async () => { await SB.auth.signOut(); toast("Вы вышли из аккаунта", ""); location.hash = "#/"; };
}

const authErr = m => /invalid login|invalid credentials/i.test(m) ? "Неверная почта или пароль." : /already registered|already been registered/i.test(m) ? "Эта почта уже зарегистрирована. Попробуйте войти." : /email not confirmed/i.test(m) ? "Подтвердите почту: письмо со ссылкой уже отправлено." : /rate limit/i.test(m) ? "Слишком много попыток. Подождите немного." : "Не получилось: " + m;

function pageLogin() {
  if (!SB) { $("#app").innerHTML = `<div class="box card"><h1>Вход</h1><p class="note">Аккаунты пока не подключены: администратору нужно один раз указать данные Supabase в index.html (см. README).</p></div>`; return; }
  if (!AUTH.ready) { $("#app").innerHTML = `<div class="card empty">Загрузка…</div>`; return; }
  if (AUTH.user) {
    $("#app").innerHTML = `<div class="box card"><h1>Ваш аккаунт</h1><p><b>${esc(AUTH.user.email)}</b></p><p><span class="badge ${isAdmin() ? "admin" : ""}">${isAdmin() ? "Администратор" : "Пользователь"}</span></p>
      ${isAdmin() ? `<p><a class="btn" href="#/admin" style="text-decoration:none;display:inline-block">Открыть админ-панель</a></p>` : `<p class="meta">Обычный аккаунт. Права администратора выдаёт разработчик.</p>`}</div>`;
    return;
  }
  let mode = "in";
  const draw = () => {
    $("#app").innerHTML = `<div class="box card"><div class="tabs"><button class="btn ${mode === "in" ? "" : "ghost"}" data-m="in" type="button">Вход</button><button class="btn ${mode === "up" ? "" : "ghost"}" data-m="up" type="button">Регистрация</button></div>
      <form id="af" novalidate>${field("email", "Email", "email")}${field("password", "Пароль" + (mode === "up" ? " (не короче 8 символов)" : ""), "password")}${mode === "up" ? field("password2", "Повторите пароль", "password") : ""}
      <button class="btn" type="submit" style="width:100%">${mode === "in" ? "Войти" : "Создать аккаунт"}</button></form>
      <p class="meta" style="margin-bottom:0">${mode === "up" ? "После регистрации придёт письмо для подтверждения почты." : "Нет аккаунта? Перейдите на вкладку «Регистрация»."}</p></div>`;
    $$("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
    bindForm($("#af"), async d => {
      const email = d.email.trim();
      if (mode === "up") {
        if (d.password.length < 8) { toast("Слабый пароль", "Минимум 8 символов.", "fail"); return false; }
        if (d.password !== d.password2) { toast("Пароли не совпадают", "Повторите пароль внимательнее.", "fail"); return false; }
        const { data, error } = await SB.auth.signUp({ email, password: d.password });
        if (error) { toast("Регистрация не удалась", authErr(error.message), "fail"); return false; }
        if (!data.session) { toast("Почти готово", "Мы отправили письмо на " + email + ". Перейдите по ссылке в нём, затем войдите.", "ok"); mode = "in"; draw(); return false; }
        toast("Добро пожаловать!", "Аккаунт создан."); return true;
      }
      const { error } = await SB.auth.signInWithPassword({ email, password: d.password });
      if (error) { toast("Не удалось войти", authErr(error.message), "fail"); return false; }
      toast("С возвращением!", ""); return true;
    });
  };
  draw();
}

/* ---------- Админ-панель: ручное добавление турниров ---------- */
const DISCS = ["CS2", "Dota 2", "Valorant", "MLBB"];
function pageAdmin() {
  if (!SB) { $("#app").innerHTML = `<div class="box card"><h1>Админ-панель</h1><p class="note">Сервис аккаунтов не подключён (см. README).</p></div>`; return; }

  const cur = [["RUB", "₽"], ["USD", "$"]];
  $("#app").innerHTML = `<h1>Админ-панель</h1><p class="lead">Добавляйте турниры вручную: например по Valorant и MLBB, клубные и городские турниры. Поле «Удалить после» убирает запись с сайта в выбранную дату.</p>
  <div class="card sect"><h2 id="ftitle">Новый турнир</h2><form id="tf" novalidate><div class="adm">
    ${inp("name", "Название *", "text", "", 1)}
    ${sel("disc", "Дисциплина *", DISCS.map(d => [d, d]))}${sel("kind", "Тип", [["main", "Турнир"], ["qualifier", "Квалификация"]])}
    ${sel("format", "Площадка", [["Online", "Онлайн"], ["LAN", "LAN (очно)"]])}${inp("city", "Город / место", "text", "Вся Россия")}
    ${inp("op", "Организатор *")}${sel("platform", "Платформа", PLATFORMS.map(p => [p, p]))}
    ${sel("team", "Формат матчей", [["5x5", "5x5"], ["2x2", "2x2"], ["1x1", "1x1"]])}${inp("teams", "Количество команд / мест", "number")}
    <label class="chk wide"><input type="checkbox" id="tba"> Даты пока неизвестны</label>
    ${inp("start", "Дата старта *", "date")}${inp("end", "Дата окончания *", "date")}${inp("time", "Время старта (МСК)", "time")}
    ${inp("regDate", "Регистрация до (дата)", "date")}${inp("regTime", "Регистрация до (время, МСК)", "time")}
    ${inp("prize", "Призовой фонд", "number")}${sel("prizeC", "Валюта призового", cur)}
    ${inp("fee", "Взнос (0 — бесплатно, пусто — не указан)", "number")}${sel("feeC", "Валюта взноса", cur)}
    <div class="field wide"><label for="desc">Описание</label><textarea id="desc" rows="4"></textarea></div>
    ${inp("fee_note", "Пояснение про взнос / условия", "text", "", 1)}${inp("contact", "Контакты и как зарегистрироваться", "text", "", 1)}
    ${inp("site", "Ссылка на турнир (https://…)", "url", "", 1)}${inp("siteName", "Подпись ссылки", "text", "Страница турнира")}
    <label class="chk"><input type="checkbox" id="student"> Студенческая лига</label><label class="chk"><input type="checkbox" id="ru" checked> Российский фокус</label>
    ${inp("expires", "Удалить информацию после (дата)", "date", "", 1)}
  </div><p class="err" id="ferr" style="margin-top:.8rem"></p>
  <div style="display:flex;gap:.6rem;margin-top:.4rem"><button class="btn" type="submit" id="fsave">Сохранить турнир</button><button class="btn ghost" type="button" id="fcancel">Очистить форму</button></div></form></div>
  <div class="card"><h2>Добавленные турниры</h2><div id="alist"><p class="meta">Загрузка…</p></div></div>`;

  const V = id => $("#" + id).value.trim();
  let editing = null, rows = [];
  const setErr = m => { $("#ferr").textContent = m || ""; };
  const mskEnd = d => d + "T23:59:59+03:00";

  const reset = () => { editing = null; $("#tf").reset(); $("#ru").checked = true; $("#ftitle").textContent = "Новый турнир"; $("#fsave").textContent = "Сохранить турнир"; $("#fcancel").textContent = "Очистить форму"; setErr(""); };
  $("#fcancel").onclick = reset;

  function fill(r) {
    const d = r.data || {};
    editing = r.id; $("#ftitle").textContent = "Редактирование"; $("#fsave").textContent = "Сохранить изменения"; $("#fcancel").textContent = "Отменить редактирование";
    const set = (id, v) => { $("#" + id).value = v ?? ""; };
    set("name", d.name); set("disc", d.disc); set("kind", d.kind || "main"); set("format", d.format); set("city", d.city); set("op", d.op); set("platform", d.platform);
    set("team", d.team || "5x5"); set("teams", d.teams); $("#tba").checked = !!d.tba; set("start", d.start); set("end", d.end); set("time", d.startsAt ? d.startsAt.slice(11, 16) : "");
    set("regDate", d.regEnd ? d.regEnd.slice(0, 10) : ""); set("regTime", d.regEnd && d.regEnd.includes("T") ? d.regEnd.slice(11, 16) : "");
    set("prize", d.prize ? d.prize.v : ""); set("prizeC", d.prize ? d.prize.c : "RUB"); set("fee", d.fee ? d.fee.v : ""); set("feeC", d.fee ? d.fee.c : "RUB");
    set("desc", d.desc); set("fee_note", d.fee_note); set("contact", d.contact); set("site", d.site); set("siteName", d.siteName);
    $("#student").checked = !!d.student; $("#ru").checked = d.ru !== false; set("expires", r.expires_at ? ymdMsk(r.expires_at) : "");
    scrollTo({ top: 0, behavior: "smooth" });
  }
  const ymdMsk = iso => new Date(iso).toLocaleDateString("sv-SE", { timeZone: "Europe/Moscow" });

  /* Собирает данные формы; при ошибке возвращает строку с пояснением. */
  function collect() {
    const name = V("name"), op = V("op"), tba = $("#tba").checked;
    if (!name) return "Укажите название турнира.";
    if (!op) return "Укажите организатора.";

      if (!V("start") || !V("end")) return "Укажите даты старта и окончания или отметьте «Даты пока неизвестны».";
      if (V("end") < V("start")) return "Дата окончания раньше даты старта.";
    }
    if (V("site") && !/^https?:\/\//i.test(V("site"))) return "Ссылка должна начинаться с http:// или https://";
    const d = { name, disc: V("disc"), kind: V("kind"), format: V("format"), city: V("city") || "Вся Россия", op, platform: V("platform"), team: V("team"),

      contact: V("contact") || "Регистрация — на странице турнира.", site: V("site") || "", siteName: V("siteName") || "Страница турнира", social: [],
      student: $("#student").checked, ru: $("#ru").checked,

    if (tba) d.tba = true; else { d.start = V("start"); d.end = V("end"); if (V("time")) d.startsAt = `${V("start")}T${V("time")}:00+03:00`; }
    if (V("regDate")) d.regEnd = V("regTime") ? `${V("regDate")}T${V("regTime")}:00+03:00` : V("regDate");
    return d;
  }

  $("#tf").onsubmit = async e => {
    e.preventDefault();
    const d = collect();
    if (typeof d === "string") { setErr(d); return toast("Форма не отправлена", d, "fail"); }
    setErr("");
    const row = { data: d, expires_at: V("expires") ? mskEnd(V("expires")) : null };
    $("#fsave").disabled = true;
    const q = editing ? SB.from("tournaments").update({ ...row, updated_at: new Date().toISOString() }).eq("id", editing) : SB.from("tournaments").insert(row);
    const { error } = await q;
    $("#fsave").disabled = false;
    if (error) return toast("Не удалось сохранить", error.message, "fail");
    toast(editing ? "Изменения сохранены" : "Турнир добавлен", d.name);
    reset(); await loadManual(); await list();
  };

  async function list() {
    const { data, error } = await SB.from("tournaments").select("id,data,expires_at").order("created_at", { ascending: false });
    if (error) { $("#alist").innerHTML = `<p class="err">Не удалось загрузить: ${esc(error.message)}</p>`; return; }
    rows = data || [];
    const now = new Date();
    $("#alist").innerHTML = rows.length ? rows.map(r => { const d = r.data || {}, exp = r.expires_at && new Date(r.expires_at) < now;
      return `<div class="arow${exp ? " exp" : ""}"><div><b>${esc(d.name)}</b><div class="meta">${esc(d.disc)} · ${d.tba ? "даты неизвестны" : esc(d.start) + " — " + esc(d.end)} · ${esc(d.op)}<br>${r.expires_at ? (exp ? "Срок показа истёк " : "Удалится после ") + ymdMsk(r.expires_at) : "Без даты удаления (скроется после окончания турнира)"}</div></div>
      <div class="acts"><button class="btn ghost" data-e="${r.id}" type="button">Изменить</button><button class="btn danger" data-x="${r.id}" type="button">Удалить</button></div></div>`; }).join("")
      : `<p class="meta">Пока ничего не добавлено.</p>`;
    $$("[data-e]").forEach(b => b.onclick = () => fill(rows.find(r => r.id === b.dataset.e)));
    $$("[data-x]").forEach(b => b.onclick = async () => {
      if (!confirm("Удалить турнир безвозвратно?")) return;
      const { error } = await SB.from("tournaments").delete().eq("id", b.dataset.x);
      if (error) return toast("Не удалось удалить", error.message, "fail");
      toast("Турнир удалён", ""); await loadManual(); await list();
    });
  }
  /* Записи с истёкшим сроком показа удаляем из базы при каждом открытии панели. */
  SB.from("tournaments").delete().lt("expires_at", new Date().toISOString()).then(list, list);
}

/* Турниры, добавленные администратором: читаются всеми посетителями, просроченные не показываются. */
async function loadManual() {
  if (!SB) return;
  try {
    const { data, error } = await SB.from("tournaments").select("id,data,expires_at");
    if (error) throw error;
    const now = new Date();
    MANUAL = (data || []).filter(r => !r.expires_at || new Date(r.expires_at) > now).map(r => clean({ ...r.data, id: "m-" + r.id, manual: true })).filter(Boolean);
  } catch (e) { console.warn("Ручные турниры недоступны:", e.message || e); }
}

/* ---------- Роутер и тема ---------- */
/* Выбирает страницу по хэшу адреса (#/, #/t/id, #/analytics, #/about, #/contacts, #/login, #/admin). */
function route() {
  const h = location.hash.replace("#", "") || "/";
  document.title = "КиберРадар — турниры по CS2, Valorant, Dota 2 и MLBB в России";
  const m = h.match(/^\/t\/(.+)$/);
  const names = { "/analytics":"analytics", "/about":"about", "/contacts":"contacts", "/login":"login", "/admin":"admin" };
  const page = m ? "home" : names[h] || "home";
  $$("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === page));
  if (m) pageTournament(m[1]); else ({ home:pageHome, analytics:pageAnalytics, about:pageAbout, contacts:pageContacts, login:pageLogin, admin:pageAdmin })[page]();
  $("#foot").innerHTML = "Данные на " + parseDate(DATA_UPDATED).toLocaleDateString("ru-RU") + ". Проверяйте актуальность на сайтах организаторов. · <a href=\"t/\">Каталог турниров</a>";
  scrollTo(0, 0);
}

/* Переключает тёмную/светлую тему добавлением/удалением CSS-класса dark на <html>. */
function setTheme(dark) {
  document.documentElement.classList.toggle("dark", dark);
  $("#themeBtn").textContent = dark ? "Светлая тема" : "Тёмная тема";
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
}
let saved = null;
try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
$("#themeBtn").onclick = () => setTheme(!document.documentElement.classList.contains("dark"));
addEventListener("hashchange", route);

/* Загружает data/faceit.json и data/vk.json независимо друг от друга: если один файл недоступен или повреждён,
   второй всё равно показывается, а при отсутствии обоих сайт работает на ручных данных. */
async function loadJsonFile(url) {
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 5000);
    const res = await fetch(url + "?t=" + Date.now(), { signal: ctl.signal, cache: "no-store" });
    clearTimeout(timer);
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch (e) { console.warn("Данные недоступны (" + url + "):", e); return null; }
}
async function loadRemote() {
  const files = await Promise.all([FACEIT_JSON, VK_JSON].map(loadJsonFile));
  let updated = "";
  REMOTE = [];
  for (const j of files) {
    if (!j) continue;
    if (Array.isArray(j.tournaments)) REMOTE.push(...j.tournaments.map(clean).filter(Boolean));
    if (j.updatedAt && j.updatedAt > updated) updated = j.updatedAt;
  }
  if (updated) DATA_UPDATED = updated.slice(0, 10);
}

/* Запуск: данные FACEIT и ручные турниры грузятся параллельно; состояние входа подхватывается позже и перерисовывает шапку/страницу. */
initSupabase();
renderAuth();
Promise.all([loadRemote(), loadManual()]).finally(route);
if (SB) {
  SB.auth.getSession().then(async ({ data }) => {
    AUTH.user = data.session ? data.session.user : null; await loadRole(); AUTH.ready = true; renderAuth();
    if (/^#\/(login|admin)/.test(location.hash)) route();
  });
  // Внутри колбэка нельзя напрямую ждать запросы Supabase (взаимная блокировка), поэтому — через setTimeout.
  SB.auth.onAuthStateChange((_e, session) => setTimeout(async () => {
    AUTH.user = session ? session.user : null; await loadRole(); AUTH.ready = true; renderAuth();
    if (/^#\/(login|admin|contacts)/.test(location.hash)) route();
  }, 0));
} else AUTH.ready = true;
</script>
