<style>
:root{

}
*,*::before,*::after{box-sizing:inherit}

.toast.ok{border-left-color:#1fa971}.toast.fail{border-left-color:var(--live)}

.steps{counter-reset:s;display:grid;gap:.7rem;margin:0;padding:0;list-style:none}

.tournament-editor .field{margin:0}.tournament-editor .wide{grid-column:1/-1}
.trash-panel{margin-top:1rem}.trash-row{display:grid;grid-template-columns:1fr auto;gap:.6rem;padding:.8rem 0;border-top:1px solid var(--line)}

@media(max-width:680px){.admin-row-tools{justify-content:stretch}.admin-row-tools button{flex:1}.trash-row{grid-template-columns:1fr}.trash-row .acts{justify-content:flex-start}}

@media (prefers-reduced-motion:reduce){.toast{animation:none}}
@media (max-width:820px){.layout,.cols{grid-template-columns:1fr}.filters{position:static}.auth{width:100%}}

<script>
"use strict";
let DATA_UPDATED = "2026-10-17";     // дата последнего снимка данных (обновляется из data/faceit.json)
const FACEIT_JSON = "data/faceit.json"; // файл, который автоматически обновляет scripts/sync-faceit.mjs

let REMOTE = [];                     // турниры, загруженные автоматически (FACEIT и ВКонтакте)
let MANUAL = [];                     // турниры, добавленные администратором вручную (хранятся в Supabase)
let TOURNAMENT_OVERRIDES = new Map(); // правки и корзина для турниров всех источников

/* ---- Подключение сервисов: заполняется один раз, инструкция в README ---- */
const SUPABASE_URL = "https://rnobslymqlgejavgvarx.supabase.co";             // например https://abcd1234.supabase.co
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJub2JzbHltcWxnZWphdmd2YXJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMjg1MzAsImV4cCI6MjEwNzkwNDUzMH0.LFQ5bulFMxIITN01dFZBxQmkh1OYzQF-Ld9kdcEazeY";        // публичный ключ anon (НЕ service_role!)
const FEEDBACK_ENDPOINT = "";        // адрес формы Formspree, например https://formspree.io/f/abcdwxyz

/* Экранирование: данные из FACEIT и базы попадают в HTML, поэтому спецсимволы обезвреживаются. */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
/* Поля из data/*.json приходят экранированными (clean); для document.title нужен обычный текст. */
const plain = h => new DOMParser().parseFromString(String(h), "text/html").documentElement.textContent;
const safeUrl = u => (/^https?:\/\//i.test(u || "") ? esc(u) : "");
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const money0 = m => (m && isFinite(+m.v) && m.v !== "" && m.v !== null ? { v: +m.v, c: m.c === "USD" ? "USD" : "RUB" } : null);
/* Приводит запись из внешнего источника к безопасному виду; негодные записи отбрасывает (null). */
function clean(t) {
  if (!t || typeof t !== "object" || !t.id || !t.name) return null;
  if (!t.tba && !(DATE_RE.test(t.start) && DATE_RE.test(t.end))) return null;
  const o = { ...t };
  for (const k of ["id", "name", "disc", "format", "city", "op", "desc", "fee_note", "contact", "siteName", "platform", "team", "startsAt", "regEnd"])
    if (o[k] != null) o[k] = esc(o[k]);
  o.site = safeUrl(o.site);
  o.social = (Array.isArray(o.social) ? o.social : []).map(x => ({ t: esc(x && x.t), u: safeUrl(x && x.u) }));
  o.prize = money0(o.prize); o.fee = money0(o.fee);
  o.teams = Number(o.teams) > 0 ? Number(o.teams) : null;
  o.cities = Array.isArray(o.cities) ? [...new Set(o.cities.map(x => esc(String(x).trim())).filter(Boolean))] : [];
  if (o.venueCity != null) o.venueCity = esc(o.venueCity);
  if (!['Online', 'LAN'].includes(o.format)) o.format = o.format || 'Не указана';
  if (!['auto', 'soon', 'checkin'].includes(o.statusMode)) o.statusMode = 'auto';
  o.soonDays = Number(o.soonDays) || 0; o.checkinDays = Number(o.checkinDays) || 0; o.removeAfterDays = Number(o.removeAfterDays) || 0;
  return o;
}
const USD_RUB = 75;                  // примерный курс для единой шкалы призовых
const DAY = 864e5;
/* Платформы для фильтра и аналитики. Турнир с own:true (проводится самой платформой: FACEIT, FASTCUP, VK Play и т.д.) в списки не попадает;
   kind:"qualifier" помечает квалификацию к конкретному турниру, platform — где она проходит. */
const PLATFORMS = ["FACEIT", "FASTCUP", "VK Play", "Cybermos", "ВКонтакте", "Сайт организатора", "Не указана"];

/* Данные о турнирах. Пополняются из поиска; даты в формате ГГГГ-ММ-ДД.
   prize/fee: {v: число, c: "USD" | "RUB"}; fee: null — взнос не указан. */
let TOURNAMENTS = []; // Загружается из data/static-tournaments.json — общий источник для сайта и SEO.

/* ---------- Вспомогательные функции ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const parseDate = (d, endOfDay) => new Date(d + (endOfDay ? "T23:59:59" : "T00:00:00"));
const toRub = m => m ? m.v * (m.c === "USD" ? USD_RUB : 1) : 0;
const fmt = n => n.toLocaleString("ru-RU");
const money = m => !m ? "не указан" : m.v === 0 ? "бесплатно" : (m.c === "USD" ? "$" + fmt(m.v) : fmt(m.v) + " ₽");
const fd = (d, y) => parseDate(d).toLocaleDateString("ru-RU", { day:"numeric", month:"long", ...(y ? { year:"numeric" } : {}) });
const hm = t => t.startsAt ? ", " + t.startsAt.slice(11, 16) + " МСК" : "";   // время старта по Москве (GMT+3)
const dates = t => t.tba ? "Даты не объявлены или не найдены"
  : t.endUnknown ? "с " + fd(t.start, true) + hm(t) + " · окончание не указано"
  : t.start === t.end ? fd(t.start, true) + hm(t)
  : fd(t.start, t.start.slice(0, 4) !== t.end.slice(0, 4)) + hm(t) + " — " + fd(t.end, true);
/* Подпись про регистрацию: «Регистрация до 5 декабря 2026 г., 16:30 МСК» или «Регистрация закрыта». */
const regLine = t => {
  if (!t.regEnd) return "";
  const hasTime = t.regEnd.includes("T"), d = t.regEnd.slice(0, 10);
  if (new Date(hasTime ? t.regEnd : d + "T23:59:59+03:00") < new Date()) return "Регистрация закрыта";
  return "Регистрация до " + fd(d, true) + (hasTime ? ", " + t.regEnd.slice(11, 16) + " МСК" : "");
};

/* Статус по дате: идёт / чек-ин (за 3 дня до старта) / скоро. null — турнир окончен или дальше 365 дней. */
function statusOf(t, now = new Date()) {
  if (t.tba) return { k:"soon", l:"Даты уточняются" };
  const s = parseDate(t.start);
  if (s - now > 365 * DAY) return null;

  // Ручной цикл «Скоро → Чек-ин → убрать» задаётся модератором от момента одобрения.
  // Он должен иметь приоритет над датой события, иначе турнир исчезает в день старта
  // и настроенный срок показа/чек-ина не отрабатывает.
  const mode = t.statusMode || "auto";
  if (mode === "soon") {
    const parsed = t.statusSetAt ? new Date(t.statusSetAt).getTime() : now.getTime();
    const setAt = Number.isFinite(parsed) ? parsed : now.getTime();
    const elapsed = Math.max(0, Math.floor((now.getTime() - setAt) / DAY));
    const soonDays = Math.max(1, Number(t.soonDays) || 1);
    const checkinDays = Math.max(1, Number(t.checkinDays) || 1);
    const removeAfterDays = Math.max(soonDays + checkinDays, Number(t.removeAfterDays) || soonDays + checkinDays);
    if (elapsed >= removeAfterDays) return null;
    if (elapsed < soonDays) return { k:"soon", l:"Скоро: " + (soonDays - elapsed) + " дн." };
    return { k:"checkin", l:"Чек-ин" };
  }

  const endIsKnown = !t.endUnknown;
  const e = endIsKnown ? parseDate(t.end, true) : null;
  if (endIsKnown && e < now) return null;
  if (s <= now) return { k:"live", l:"Турнир идёт" };
  if (mode === "checkin") return { k:"checkin", l:"Чек-ин" };
  if (s - now <= 3 * DAY) return { k:"checkin", l:"Чек-ин" };
  return { k:"soon", l:"Скоро: " + Math.ceil((s - now) / DAY) + " дн." };
}

/* Актуальные турниры: завершённые автоматически исчезают из списков. */
/* Склейка ручных данных и автозагрузки: ручные записи FACEIT, дублирующие автоматические (тот же UUID в ссылке), отбрасываются. */
const allTournaments = () => {
  const uuid = u => ((u || "").match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i) || [""])[0].toLowerCase();
  const auto = new Set(REMOTE.map(t => uuid(t.site)).filter(Boolean));
  const ids = new Set();
  const merged = [...TOURNAMENTS.filter(t => !auto.has(uuid(t.site))), ...REMOTE, ...MANUAL]
    .filter(t => !ids.has(t.id) && ids.add(t.id));
  return merged.flatMap(t => {
    const ov = TOURNAMENT_OVERRIDES.get(String(t.id));
    if (ov && (ov.is_trashed || ov.permanently_hidden)) return [];
    const patch = ov && ov.patch && typeof ov.patch === "object" ? ov.patch : {};
    // Входные JSON уже прошли clean() при загрузке. Перед повторной нормализацией
    // возвращаем их строковые поля к тексту, чтобы не получить двойное HTML-экранирование.
    const base = { ...t };
    for (const k of ["id", "name", "disc", "format", "city", "op", "desc", "fee_note", "contact", "siteName", "platform", "team", "startsAt", "regEnd", "venueCity", "site"])
      if (base[k] != null) base[k] = plain(base[k]);
    base.cities = (base.cities || []).map(x => plain(x));
    base.social = (base.social || []).map(x => ({ t: plain(x.t), u: plain(x.u) }));
    const safe = clean({ ...base, ...patch, id: t.id });
    return safe ? [{ ...safe, _sourceId: String(t.id) }] : [];
  });
};
const activeList = () => allTournaments().map(t => ({ team:"5x5", platform:"Не указана", ru:true, ...t, kind: t.kind || (/qualif|квалиф/i.test(t.name) ? "qualifier" : "main"), st: statusOf(t) })).filter(t => t.st && !t.own && !t.fp)
  .sort((a, b) => (a.tba ? 9e15 : +parseDate(a.start)) - (b.tba ? 9e15 : +parseDate(b.start)));

/* Показывает всплывающее уведомление вместо alert/перезагрузки. */
function toast(title, text, type = "ok") {
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.innerHTML = "<b></b><span></span>";
  el.firstChild.textContent = title; el.lastChild.textContent = text;
  $("#toasts").append(el);
  setTimeout(() => el.remove(), 4500);
}

/* Проверка email: что-то@домен.зона без пробелов. */
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim());

/* Подключает валидацию к форме; при успехе вызывает onOk и очищает форму без перезагрузки. */
function bindForm(form, onOk) {
  form.addEventListener("submit", e => {
    e.preventDefault();
    let ok = true;
    $$(".field", form).forEach(f => {
      const i = $("input,textarea", f), v = i.value.trim();
      let msg = "";
      if (!v) msg = "Заполните поле";
      else if (i.type === "email" && !validEmail(v)) msg = "Введите корректный email, например name@mail.ru";
      f.classList.toggle("bad", !!msg); $(".err", f).textContent = msg;
      if (msg) ok = false;
    });
    if (!ok) return toast("Форма не отправлена", "Проверьте выделенные поля.", "fail");
    const r = onOk(Object.fromEntries(new FormData(form)));
    if (r && r.then) r.then(ok => { if (ok !== false) form.reset(); });   // при ошибке отправки текст остаётся в форме
    else form.reset();
  });
}

/* Генерирует HTML поля формы. */
const field = (name, label, type = "text", area = false) =>
  `<div class="field"><label for="${name}">${label}</label>${area ? `<textarea id="${name}" name="${name}" rows="4"></textarea>` : `<input id="${name}" name="${name}" type="${type}" autocomplete="off">`}<div class="err"></div></div>`;

  <div><div class="prize">${money(t.prize)}</div>${t.prize && t.prize.c === "USD" ? `<div class="meta" style="text-align:right">≈ ${fmt(toRub(t.prize))} ₽</div>` : ""}<div class="meta" style="text-align:right">взнос: ${money(t.fee)}</div></div></a>
  ${isAdmin() ? `<div class="admin-row-tools"><button type="button" data-admin-edit="${esc(t.id)}">Редактировать</button><button type="button" data-admin-trash="${esc(t.id)}">В корзину</button></div>` : ""}</div>`;

function tournamentEditorDialog(t) {

  return `<dialog class="tournament-editor" id="tournamentEditor"><form id="tournamentEditorForm">
    <input type="hidden" name="sourceId" value="${val(d.id)}">
    <h2>Редактирование турнира</h2>
    <div class="adm">
      <div class="field wide"><label>Название</label><input name="name" required maxlength="200" value="${val(d.name)}"></div>
      <div class="field"><label>Дисциплина</label><select name="disc">${["CS2","Dota 2","Valorant","MLBB"].map(x=>`<option${d.disc===x?" selected":""}>${x}</option>`).join("")}</select></div>
      <div class="field"><label>Тип</label><select name="kind"><option value="main"${d.kind!=="qualifier"?" selected":""}>Турнир</option><option value="qualifier"${d.kind==="qualifier"?" selected":""}>Квалификация</option></select></div>

function openTournamentEditor(t) {
  const old = $("#tournamentEditor"); if (old) old.remove();
  $("#app").insertAdjacentHTML("beforeend", tournamentEditorDialog(t));
  const dlg = $("#tournamentEditor"), form = $("#tournamentEditorForm");
  $("#teCancel").onclick = () => dlg.close();
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  form.onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(form), v = k => String(f.get(k) || "").trim();
    const name = v("name"), site = v("site"), tba = f.has("tba");
    if (!name) return $("#teError").textContent = "Название обязательно.";
    if (!tba && (!v("start") || !v("end") || v("end") < v("start"))) return $("#teError").textContent = "Укажите корректные даты начала и окончания.";
    if (site && !/^https?:\/\//i.test(site)) return $("#teError").textContent = "Ссылка должна начинаться с http:// или https://.";
    const patch = { name, disc:v("disc"), kind:v("kind"), format:v("format"), city:v("city") || (v("format")==="Online"?"Онлайн":"Не указан"), cities:v("format")==="LAN" ? [...new Set(v("city").split(/[,;|/]/).map(x=>x.trim()).filter(Boolean))] : [], op:v("op"), platform:v("platform"), team:v("team"),
      desc:v("desc"), fee_note:v("fee_note"), contact:v("contact"), site, siteName:v("siteName"), student:f.has("student"), ru:f.has("ru"),
      prize:v("prizeValue")!==""?{v:Number(v("prizeValue")),c:v("prizeCurrency")} : null,
      fee:v("feeValue")!==""?{v:Number(v("feeValue")),c:v("feeCurrency")} : null };
    if (tba) patch.tba = true; else { patch.tba = false; patch.start=v("start"); patch.end=v("end"); if(v("time")) patch.startsAt=`${v("start")}T${v("time")}:00+03:00`; else patch.startsAt=null; }
    try { await saveTournamentOverride(v("sourceId"), patch); dlg.close(); toast("Турнир обновлён", name); route(); }
    catch (err) { $("#teError").textContent = err.message || "Не удалось сохранить."; }
  };
  dlg.showModal();
}

/* ---------- Страница 1: поиск и фильтры ---------- */
function pageHome() {
  const all = activeList();
  const discs = ["CS2", "Dota 2", "Valorant", "MLBB"];              // порядок групп на странице
  const ops = [...new Set(all.map(t => t.op))];
  const lanCities = [...new Set(all.filter(t => t.format === "LAN").flatMap(tournamentCities))].sort((a,b)=>a.localeCompare(b,"ru"));

  const f = { q:"", d:new Set(), o:new Set(), m:new Set(), p:new Set(), venue:new Set(), city:new Set(), stu:false, qual:false, ru:false, prize:[0, 0], fee:[0, 0] };
  const openG = new Set();                                           // раскрытые группы турниров

      <div class="hero-search"><input type="search" id="q" placeholder="Найти турнир, игру или организатора" aria-label="Поиск турниров"><button class="btn" type="button" id="heroSearch">Найти турнир</button></div>
    </div>
    <div class="hero-metrics" aria-label="Статистика каталога">
      <div class="hero-metric"><b>${all.length}</b><span>актуальных событий</span></div>
      <div class="hero-metric"><b>${datedCount}</b><span>с объявленными датами</span></div>
      <div class="hero-metric"><b>${freeCount}</b><span>бесплатных турниров</span></div>
      <div class="hero-metric"><b>4</b><span>киберспортивные дисциплины</span></div>
    </div>
  </section>
  <div class="quick-games"><span class="quick-games-label">Быстрый выбор</span>${discs.map(d => `<button class="game-chip" type="button" data-quick-disc="${d}" aria-pressed="false">${d}</button>`).join("")}</div>
  <div class="directory-toolbar"><button class="btn ghost filter-toggle" id="filterToggle" type="button" aria-expanded="false">☷ Фильтры</button><div class="meta" id="count" aria-live="polite"></div>
    <label class="directory-sort">Сортировка <select id="sort"><option value="date">По дате</option><option value="prize">По призовым</option><option value="name">По названию</option></select></label>

  <div class="layout"><aside class="card filters" id="filtersPanel" aria-label="Фильтры">
    <div class="filters-head"><h2>Фильтры</h2><button class="btn ghost filter-close" id="filterClose" type="button">Закрыть</button></div>
    ${dd("d", "Дисциплина", discs.map(d => chk("d", d, d === "MLBB" ? "MLBB (Mobile Legends: Bang Bang)" : d)).join(""))}
    ${dd("m", "Формат матчей", ["1x1", "2x2", "5x5"].map(m => chk("m", m)).join(""))}
    ${dd("venue", "Площадка турнира", [chk("venue", "Online", `ONLINE (${all.filter(t=>t.format==="Online").length})`), chk("venue", "LAN", `LAN (${all.filter(t=>t.format==="LAN").length})`)].join(""))}

    ${dd("p", "Платформа", PLATFORMS.map(p => chk("p", p, `${p} (${all.filter(t => t.platform === p).length})`)).join(""))}

    <button class="btn ghost" type="button" id="reset">Сбросить</button>
  </aside><section aria-label="Результаты поиска"><div id="list"></div></section></div>`;

  /* Границы и подписи пары ползунков; `moved` — какой двигали (он не может перескочить соседа). */
  function slider(id, reset, moved) {
    const base = all.filter(t => !f.d.size || f.d.has(t.disc));
    const mx = Math.ceil(Math.max(0, ...base.map(t => toRub(t[id]))) / SL[id]) * SL[id];
    const lo = $("#" + id + "min"), hi = $("#" + id + "max");
    lo.max = hi.max = mx; lo.disabled = hi.disabled = mx === 0;
    if (reset) { lo.value = 0; hi.value = mx; }
    if (+lo.value > +hi.value) (moved === "min" ? hi : lo).value = (moved === "min" ? lo : hi).value;
    f[id] = [+lo.value, +hi.value];
    $("#" + id + "V").textContent = mx === 0 ? "нет данных" : "от " + fmt(f[id][0]) + " до " + fmt(f[id][1]) + " ₽ (макс. " + fmt(mx) + " ₽)";
  }
  const bounds = reset => Object.keys(SL).forEach(id => slider(id, reset));
  const inRange = (m, [lo, hi]) => { const v = toRub(m); return v >= lo && v <= hi; };

  /* Применяет фильтры и рисует турниры группами по играм (раскрывающиеся списки). */
  function draw() {
    const q = f.q.toLowerCase();
    const res = all.filter(t => (!q || [t.name, t.op, t.city, t.disc, t.platform].join(" ").toLowerCase().includes(q)) && (!f.d.size || f.d.has(t.disc)) &&
      (!f.o.size || f.o.has(t.op)) && (!f.m.size || f.m.has(t.team)) && (!f.p.size || f.p.has(t.platform)) && (!f.venue.size || f.venue.has(t.format)) && (!f.city.size || (t.format === "LAN" && tournamentCities(t).some(c => f.city.has(c)))) && (!f.stu || t.student) &&
      (!f.qual || t.kind === "qualifier") && (!f.ru || t.ru) && inRange(t.prize, f.prize) && (t.fee ? inRange(t.fee, f.fee) : f.fee[0] === 0));
    const sortMode = $("#sort") ? $("#sort").value : "date";
    if (sortMode === "prize") res.sort((a,b) => toRub(b.prize) - toRub(a.prize));
    else if (sortMode === "name") res.sort((a,b) => plain(a.name).localeCompare(plain(b.name), "ru"));
    else res.sort((a,b) => (a.tba ? 9e15 : +parseDate(a.start)) - (b.tba ? 9e15 : +parseDate(b.start)));
    $("#count").textContent = "Найдено " + res.length + " из " + all.length + " турниров";
    const order = d => (discs.includes(d) ? discs.indexOf(d) : 99);
    const games = [...new Set(res.map(t => t.disc))].sort((x, y) => order(x) - order(y));
    $("#list").innerHTML = res.length ? games.map(d => { const g = res.filter(t => t.disc === d);
      return `<details class="grp" data-g="${d}"${openG.has(d) || f.q ? " open" : ""}><summary>${d}<b>${g.length}</b></summary><div class="list">${g.map(row).join("")}</div></details>`; }).join("")
      : `<div class="card empty">Ничего не найдено. Расширьте фильтры или сбросьте их.</div>`;
    $$(".grp").forEach(g => g.ontoggle = () => (g.open ? openG.add(g.dataset.g) : openG.delete(g.dataset.g)));
    $$('[data-c]').forEach(e => { const n = e.dataset.c === "t" ? +f.stu + +f.qual + +f.ru : f[e.dataset.c].size; e.textContent = n ? " · " + n : ""; });
    $$('[data-d]').forEach(c => c.checked = f.d.has(c.dataset.d));
    $$('[data-venue]').forEach(c => c.checked = f.venue.has(c.dataset.venue));
    $$('[data-city]').forEach(c => c.checked = f.city.has(c.dataset.city));
    const cityPanel = $("#lanCityFilter"); if (cityPanel) cityPanel.style.display = f.venue.has("LAN") ? "block" : "none";
    $$('[data-quick-disc]').forEach(b => b.setAttribute('aria-pressed', String(f.d.has(b.dataset.quickDisc))));
    const active = f.d.size + f.o.size + f.m.size + f.p.size + f.venue.size + f.city.size + +f.stu + +f.qual + +f.ru;
    const ft = $('#filterToggle'); if (ft) ft.textContent = active ? `☷ Фильтры · ${active}` : '☷ Фильтры';
  }
  $("#q").oninput = e => { f.q = e.target.value; draw(); };
  $$("[data-d]").forEach(c => c.onchange = () => { c.checked ? f.d.add(c.dataset.d) : f.d.delete(c.dataset.d); bounds(true); draw(); });
  $$("[data-o]").forEach(c => c.onchange = () => { c.checked ? f.o.add(c.dataset.o) : f.o.delete(c.dataset.o); draw(); });
  $$("[data-m]").forEach(c => c.onchange = () => { c.checked ? f.m.add(c.dataset.m) : f.m.delete(c.dataset.m); draw(); });
  $$("[data-p]").forEach(c => c.onchange = () => { c.checked ? f.p.add(c.dataset.p) : f.p.delete(c.dataset.p); draw(); });
  $$('[data-venue]').forEach(c => c.onchange = () => { c.checked ? f.venue.add(c.dataset.venue) : f.venue.delete(c.dataset.venue); if (!f.venue.has("LAN")) f.city.clear(); draw(); });
  $$('[data-city]').forEach(c => c.onchange = () => { c.checked ? f.city.add(c.dataset.city) : f.city.delete(c.dataset.city); draw(); });
  $("#stu").onchange = e => { f.stu = e.target.checked; draw(); };
  $("#qual").onchange = e => { f.qual = e.target.checked; draw(); };
  $("#ru").onchange = e => { f.ru = e.target.checked; draw(); };
  Object.keys(SL).forEach(id => ["min", "max"].forEach(k => $("#" + id + k).oninput = () => { slider(id, false, k); draw(); }));
  $("#reset").onclick = pageHome;
  $("#sort").onchange = draw;
  $("#heroSearch").onclick = () => $("#q").focus();
  $$('[data-quick-disc]').forEach(b => b.onclick = () => {
    const d = b.dataset.quickDisc;
    if (f.d.has(d)) f.d.delete(d); else f.d.add(d);
    bounds(true); draw();
  });
  const panel = $('#filtersPanel'), toggle = $('#filterToggle');
  const closeFilters = () => { panel.classList.remove('open'); document.body.classList.remove('filters-open'); toggle.setAttribute('aria-expanded','false'); };
  toggle.onclick = () => { const open = !panel.classList.contains('open'); panel.classList.toggle('open', open); document.body.classList.toggle('filters-open', open); toggle.setAttribute('aria-expanded', String(open)); if (open) $('#filterClose').focus(); };
  document.onclick = e => { if (document.body.classList.contains('filters-open') && !panel.contains(e.target) && !toggle.contains(e.target)) closeFilters(); };
  $('#filterClose').onclick = closeFilters;
  document.onkeydown = e => { if (e.key === 'Escape' && panel.classList.contains('open')) closeFilters(); };
  // Делегирование кликов: кнопки администратора остаются рабочими после каждой перерисовки фильтров.
  $("#list").addEventListener("click", async e => {
    const editButton = e.target.closest("[data-admin-edit]");
    const trashButton = e.target.closest("[data-admin-trash]");
    if (!editButton && !trashButton) return;
    e.preventDefault(); e.stopPropagation();

    if (editButton) openTournamentEditor(tournament);
    else await moveTournamentToTrash(tournament);
  });
  bounds(true); draw();
}

/* ---------- Страница: аналитика по актуальным турнирам ---------- */
function pageAnalytics() {
  const all = activeList(), dated = all.filter(t => !t.tba), now = new Date();
  const known = all.filter(t => t.prize), sum = known.reduce((s, t) => s + toRub(t.prize), 0);
  /* Считает турниры по ключу, сортирует по убыванию. */
  const groupBy = (arr, fn) => { const m = new Map(); arr.forEach(t => m.set(fn(t), (m.get(fn(t)) || 0) + 1)); return [...m].sort((a, b) => b[1] - a[1]); };
  /* Рисует горизонтальные столбики из строк [подпись, значение, текст справа]. */
  const bars = rows => { const mx = Math.max(1, ...rows.map(r => r[1])); return rows.map(([l, v, x]) => `<div class="br"><span>${l}</span><div class="tr"><i style="width:${v / mx * 100}%"></i></div><b>${x ?? v}</b></div>`).join(""); };
  const card = (h, body, note = "") => `<div class="card"><h2>${h}</h2>${body}${note ? `<p class="meta">${note}</p>` : ""}</div>`;
  const kpi = (v, l) => `<div class="card kpi"><b>${v}</b><span>${l}</span></div>`;
  const discs = ["CS2", "Valorant", "Dota 2", "MLBB"].map(d => { const a = all.filter(t => t.disc === d); return [d, a.length, a.length + " · " + fmt(a.reduce((s, t) => s + toRub(t.prize), 0)) + " ₽"]; });
  const plats = PLATFORMS.map(p => [p, all.filter(t => t.platform === p).length]);
  const teams = ["1x1", "2x2", "5x5"].map(m => [m, all.filter(t => t.team === m).length]);

  const buckets = [["не указан", t => !t.prize], ["до 50 тыс. ₽", t => t.prize && toRub(t.prize) < 5e4], ["50–500 тыс. ₽", t => t.prize && toRub(t.prize) >= 5e4 && toRub(t.prize) < 5e5], ["от 500 тыс. ₽", t => t.prize && toRub(t.prize) >= 5e5]].map(([l, fn]) => [l, all.filter(fn).length]);

}

/* ---------- Аккаунты и роли (Supabase) ---------- */
let SB = null;                                  // клиент Supabase (null, пока сервис не подключён)
const AUTH = { user: null, role: null, ready: false };   // role: "user" или "admin"

function initSupabase() {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !window.supabase) return false;
  SB = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return true;
}
/* Роль берётся из таблицы profiles; изменить её может только администратор базы данных. */
async function loadRole() {
  AUTH.role = null;
  if (!SB || !AUTH.user) return;
  const { data } = await SB.from("profiles").select("role").eq("id", AUTH.user.id).maybeSingle();
  AUTH.role = data && data.role === "admin" ? "admin" : "user";
}
const isAdmin = () => AUTH.role === "admin";

/* Блок «Войти / email · роль · Выйти» в шапке. */
function renderAuth() {
  const box = $("#auth");
  box.innerHTML = AUTH.user
    ? `<span class="who" title="${esc(AUTH.user.email)}">${esc(AUTH.user.email)}</span><span class="badge ${isAdmin() ? "admin" : ""}">${isAdmin() ? "Администратор" : "Пользователь"}</span><button class="btn ghost" id="logout" type="button">Выйти</button>`
    : `<a class="btn ghost" href="#/login" style="text-decoration:none">Войти</a>`;
  $("#navAdmin").hidden = !isAdmin();
  const lo = $("#logout"); if (lo) lo.onclick = async () => { await SB.auth.signOut(); toast("Вы вышли из аккаунта", ""); location.hash = "#/"; };

const authErr = m => /invalid login|invalid credentials/i.test(m) ? "Неверная почта или пароль." : /already registered|already been registered/i.test(m) ? "Эта почта уже зарегистрирована. Попробуйте войти." : /email not confirmed/i.test(m) ? "Подтвердите почту: письмо со ссылкой уже отправлено." : /rate limit/i.test(m) ? "Слишком много попыток. Подождите немного." : "Не получилось: " + m;

function pageLogin() {
  if (!SB) { $("#app").innerHTML = `<div class="box card"><h1>Вход</h1><p class="note">Аккаунты пока не подключены: администратору нужно один раз указать данные Supabase в index.html (см. README).</p></div>`; return; }
  if (!AUTH.ready) { $("#app").innerHTML = `<div class="card empty">Загрузка…</div>`; return; }
  if (AUTH.user) {
    $("#app").innerHTML = `<div class="box card"><h1>Ваш аккаунт</h1><p><b>${esc(AUTH.user.email)}</b></p><p><span class="badge ${isAdmin() ? "admin" : ""}">${isAdmin() ? "Администратор" : "Пользователь"}</span></p>
      ${isAdmin() ? `<p><a class="btn" href="#/admin" style="text-decoration:none;display:inline-block">Открыть админ-панель</a></p>` : `<p class="meta">Обычный аккаунт. Права администратора выдаёт разработчик.</p>`}</div>`;
    return;
  }
  let mode = "in";
  const draw = () => {
    $("#app").innerHTML = `<div class="box card"><div class="tabs"><button class="btn ${mode === "in" ? "" : "ghost"}" data-m="in" type="button">Вход</button><button class="btn ${mode === "up" ? "" : "ghost"}" data-m="up" type="button">Регистрация</button></div>
      <form id="af" novalidate>${field("email", "Email", "email")}${field("password", "Пароль" + (mode === "up" ? " (не короче 8 символов)" : ""), "password")}${mode === "up" ? field("password2", "Повторите пароль", "password") : ""}
      <button class="btn" type="submit" style="width:100%">${mode === "in" ? "Войти" : "Создать аккаунт"}</button></form>
      <p class="meta" style="margin-bottom:0">${mode === "up" ? "После регистрации придёт письмо для подтверждения почты." : "Нет аккаунта? Перейдите на вкладку «Регистрация»."}</p></div>`;
    $$("[data-m]").forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
    bindForm($("#af"), async d => {
      const email = d.email.trim();
      if (mode === "up") {
        if (d.password.length < 8) { toast("Слабый пароль", "Минимум 8 символов.", "fail"); return false; }
        if (d.password !== d.password2) { toast("Пароли не совпадают", "Повторите пароль внимательнее.", "fail"); return false; }
        const { data, error } = await SB.auth.signUp({ email, password: d.password });
        if (error) { toast("Регистрация не удалась", authErr(error.message), "fail"); return false; }
        if (!data.session) { toast("Почти готово", "Мы отправили письмо на " + email + ". Перейдите по ссылке в нём, затем войдите.", "ok"); mode = "in"; draw(); return false; }
        toast("Добро пожаловать!", "Аккаунт создан."); return true;
      }
      const { error } = await SB.auth.signInWithPassword({ email, password: d.password });
      if (error) { toast("Не удалось войти", authErr(error.message), "fail"); return false; }
      toast("С возвращением!", ""); return true;
    });
  };
  draw();
}

    ${sel("team", "Формат матчей", [["5x5", "5x5"], ["2x2", "2x2"], ["1x1", "1x1"]])}${inp("teams", "Количество команд / мест", "number")}
    <label class="chk wide"><input type="checkbox" id="tba"> Даты пока неизвестны</label>
    ${inp("start", "Дата старта *", "date")}${inp("end", "Дата окончания *", "date")}${inp("time", "Время старта (МСК)", "time")}
    ${inp("regDate", "Регистрация до (дата)", "date")}${inp("regTime", "Регистрация до (время, МСК)", "time")}
    ${inp("prize", "Призовой фонд", "number")}${sel("prizeC", "Валюта призового", cur)}
    ${inp("fee", "Взнос (0 — бесплатно, пусто — не указан)", "number")}${sel("feeC", "Валюта взноса", cur)}
    <div class="field wide"><label for="desc">Описание</label><textarea id="desc" rows="4"></textarea></div>
    ${inp("fee_note", "Пояснение про взнос / условия", "text", "", 1)}${inp("contact", "Контакты и как зарегистрироваться", "text", "", 1)}

    <label class="chk"><input type="checkbox" id="student"> Студенческая лига</label><label class="chk"><input type="checkbox" id="ru" checked> Российский фокус</label>
    ${inp("expires", "Удалить информацию после (дата)", "date", "", 1)}
  </div><p class="err" id="ferr" style="margin-top:.8rem"></p>
  <div style="display:flex;gap:.6rem;margin-top:.4rem"><button class="btn" type="submit" id="fsave">Сохранить турнир</button><button class="btn ghost" type="button" id="fcancel">Очистить форму</button></div></form></div>
  <div class="card"><h2>Добавленные турниры</h2><div id="alist"><p class="meta">Загрузка…</p></div></div>
  <div class="card trash-panel"><h2>Корзина турниров · хранение до 7 дней</h2><p class="meta">После истечения семи дней данные события удаляются без возможности восстановления.</p><div id="trashList"><p class="meta">Загрузка корзины…</p></div></div>`;

  const V = id => $("#" + id).value.trim();
  let editing = null, rows = [];
  const setErr = m => { $("#ferr").textContent = m || ""; };
  const mskEnd = d => d + "T23:59:59+03:00";

  const reset = () => { editing = null; $("#tf").reset(); $("#ru").checked = true; $("#ftitle").textContent = "Новый турнир"; $("#fsave").textContent = "Сохранить турнир"; $("#fcancel").textContent = "Очистить форму"; setErr(""); };
  $("#fcancel").onclick = reset;

  function fill(r) {
    const d = r.data || {};
    editing = r.id; $("#ftitle").textContent = "Редактирование"; $("#fsave").textContent = "Сохранить изменения"; $("#fcancel").textContent = "Отменить редактирование";
    const set = (id, v) => { $("#" + id).value = v ?? ""; };
    set("name", d.name); set("disc", d.disc); set("kind", d.kind || "main"); set("format", d.format); set("city", d.city); set("op", d.op); set("platform", d.platform);

    set("regDate", d.regEnd ? d.regEnd.slice(0, 10) : ""); set("regTime", d.regEnd && d.regEnd.includes("T") ? d.regEnd.slice(11, 16) : "");

    return d;
  }

  $("#tf").onsubmit = async e => {
    e.preventDefault();
    const d = collect();
    if (typeof d === "string") { setErr(d); return toast("Форма не отправлена", d, "fail"); }
    setErr("");
    const row = { data: d, expires_at: V("expires") ? mskEnd(V("expires")) : null };
    $("#fsave").disabled = true;
    const q = editing ? SB.from("tournaments").update({ ...row, updated_at: new Date().toISOString() }).eq("id", editing) : SB.from("tournaments").insert(row);
    const { error } = await q;
    $("#fsave").disabled = false;
    if (error) return toast("Не удалось сохранить", error.message, "fail");
    toast(editing ? "Изменения сохранены" : "Турнир добавлен", d.name);
    reset(); await loadManual(); await list();
  };

  async function list() {
    // Перезагружаем overrides перед списком: удалённые вручную турниры остаются
    // в исходной таблице до истечения 7 дней, но не должны показываться среди активных.
    await loadTournamentOverrides();
    const { data, error } = await SB.from("tournaments").select("id,data,expires_at").order("created_at", { ascending: false });
    if (error) { $("#alist").innerHTML = `<p class="err">Не удалось загрузить: ${esc(error.message)}</p>`; return; }
    rows = (data || []).filter(r => {
      const sourceId = String(r.data?.restored_source_id || ("m-" + r.id));
      const ov = TOURNAMENT_OVERRIDES.get(sourceId);
      return !(ov && (ov.is_trashed || ov.permanently_hidden));
    });
    const now = new Date();
    $("#alist").innerHTML = rows.length ? rows.map(r => { const d = r.data || {}, exp = r.expires_at && new Date(r.expires_at) < now;
      return `<div class="arow${exp ? " exp" : ""}"><div><b>${esc(d.name)}</b><div class="meta">${esc(d.disc)} · ${d.tba ? "даты неизвестны" : esc(d.start) + " — " + esc(d.end)} · ${esc(d.op)}<br>${r.expires_at ? (exp ? "Срок показа истёк " : "Удалится после ") + ymdMsk(r.expires_at) : "Без даты удаления (скроется после окончания турнира)"}</div></div>
      <div class="acts"><button class="btn ghost" data-e="${r.id}" type="button">Изменить</button><button class="btn danger" data-x="${r.id}" type="button">Удалить</button></div></div>`; }).join("")
      : `<p class="meta">Пока ничего не добавлено.</p>`;
    $$("[data-e]").forEach(b => b.onclick = () => fill(rows.find(r => r.id === b.dataset.e)));
    $$("[data-x]").forEach(b => b.onclick = async () => {
      const r = rows.find(x => x.id === b.dataset.x); if (!r) return;
      const t = clean({ ...r.data, id: "m-" + r.id, manual: true });
      await moveTournamentToTrash(t);
      await loadManual(); await list();
    });
  }
  async function listTrash() {
    const { data, error } = await SB.from("tournament_trash").select("source_id,source_type,snapshot,deleted_at,purge_at").order("deleted_at", { ascending: false });
    if (error) { $("#trashList").innerHTML = `<p class="err">Корзина пока недоступна: ${esc(error.message)}. Проверьте SQL-миграцию.</p>`; return; }
    const rowsTrash = data || [];
    $("#trashList").innerHTML = rowsTrash.length ? rowsTrash.map(r => {
      const name = plain(r.snapshot?.name || r.snapshot?.title || r.source_id);
      const remaining = Math.max(0, Math.ceil((new Date(r.purge_at) - Date.now()) / 86400000));
      return `<div class="trash-row"><div><b>${esc(name)}</b><div class="meta">Источник: ${esc(r.source_type)} · удаление безвозвратно: ${new Date(r.purge_at).toLocaleString("ru-RU")} (осталось ${remaining} дн.)</div></div><div class="acts"><button class="btn ghost" data-restore-trash="${esc(r.source_id)}">Восстановить</button></div></div>`;
    }).join("") : `<p class="meta">Корзина пуста.</p>`;
    $$('[data-restore-trash]').forEach(b => b.onclick = async () => {
      const { error } = await SB.rpc("restore_tournament", { p_source_id: b.dataset.restoreTrash });
      if (error) return toast("Не удалось восстановить", error.message, "fail");
      toast("Турнир восстановлен", "Он снова появится в общем списке, если источник доступен.");
      await loadTournamentOverrides(); await loadManual(); await list(); await listTrash();
    });
  }
  SB.rpc("purge_expired_tournament_trash").then(({error}) => { if (error) console.warn("Автоочистка корзины:", error.message); }).finally(() => { list(); listTrash(); });
  /* Старые записи с явным expires_at продолжают очищаться своим прежним правилом. */
  SB.from("tournaments").delete().lt("expires_at", new Date().toISOString()).then(list, list);
}

/* Турниры, добавленные администратором: читаются всеми посетителями, просроченные не показываются. */
async function loadManual() {
  if (!SB) return;
  try {
    const { data, error } = await SB.from("tournaments").select("id,data,expires_at");
    if (error) throw error;
    const now = new Date();
    MANUAL = (data || []).filter(r => !r.expires_at || new Date(r.expires_at) > now).map(r => clean({
      ...r.data, id: r.data?.restored_source_id || ("m-" + r.id), manual: true
    })).filter(Boolean);
  } catch (e) { console.warn("Ручные турниры недоступны:", e.message || e); }
}

async function loadTournamentOverrides() {
  if (!SB) return;
  try {
    const { data, error } = await SB.from("tournament_overrides").select("source_id,patch,is_trashed,permanently_hidden");
    if (error) throw error;
    TOURNAMENT_OVERRIDES = new Map((data || []).map(r => [String(r.source_id), r]));
  } catch (e) {
    console.warn("Правки/корзина турниров пока недоступны. Выполните SQL-миграцию:", e.message || e);
    TOURNAMENT_OVERRIDES = new Map();
  }
}

const tournamentCities = t => {
  const raw = Array.isArray(t.cities) && t.cities.length ? t.cities : String(t.city || "").split(/[,;|/]/);
  return [...new Set(raw.map(x => plain(String(x)).trim()).filter(x => x && !/^(онлайн|вся россия|не указан[ао]?)$/i.test(x)))];
};
const sourceTypeOf = t => t.manual || String(t.id).startsWith("m-") ? "manual"
  : t.platform === "ВКонтакте" || String(t.id).startsWith("vk") ? "vk"
  : t.platform === "FACEIT" ? "faceit" : "static";

async function moveTournamentToTrash(t) {
  if (!SB || !isAdmin()) return toast("Нужны права администратора.", "", "fail");
  if (!confirm(`Переместить «${plain(t.name)}» в корзину? Оно будет доступно для восстановления 7 дней.`)) return;
  const snapshot = { ...t };
  for (const k of ["id", "name", "disc", "format", "city", "op", "desc", "fee_note", "contact", "siteName", "platform", "team", "startsAt", "regEnd", "venueCity", "site"])
    if (snapshot[k] != null) snapshot[k] = plain(snapshot[k]);
  snapshot.cities = (snapshot.cities || []).map(x => plain(x));
  snapshot.social = (snapshot.social || []).map(x => ({ t: plain(x.t), u: plain(x.u) }));
  const { error } = await SB.rpc("trash_tournament", {
    p_source_id: String(t.id), p_source_type: sourceTypeOf(t), p_snapshot: snapshot
  });
  if (error) return toast("Не удалось переместить в корзину", error.message, "fail");
  await loadTournamentOverrides();
  toast("Турнир перемещён в корзину", "Его можно восстановить в течение 7 дней.");
  route();
}

async function saveTournamentOverride(sourceId, patch) {
  if (!SB || !isAdmin()) throw new Error("Нужны права администратора.");
  const fields = ["name", "disc", "kind", "format", "city", "cities", "op", "platform", "team", "teams", "start", "end", "tba", "startsAt", "regEnd", "prize", "fee", "desc", "fee_note", "contact", "site", "siteName", "student", "ru"];
  const safe = Object.fromEntries(Object.entries(patch).filter(([k]) => fields.includes(k)));
  const { error } = await SB.from("tournament_overrides").upsert({
    source_id: String(sourceId), patch: safe, is_trashed: false, permanently_hidden: false,
    updated_by: AUTH.user.id, updated_at: new Date().toISOString()
  }, { onConflict: "source_id" });
  if (error) throw error;
  await loadTournamentOverrides();
}

/* ---------- Роутер и тема ---------- */
/* Выбирает страницу по хэшу адреса (#/, #/t/id, #/analytics, #/about, #/contacts, #/login, #/admin). */
function route() {
  const h = location.hash.replace("#", "") || "/";
  document.title = "КиберРадар — турниры по CS2, Valorant, Dota 2 и MLBB в России";
  const m = h.match(/^\/t\/(.+)$/);
  const names = { "/analytics":"analytics", "/about":"about", "/contacts":"contacts", "/login":"login", "/admin":"admin" };
  const page = m ? "home" : names[h] || "home";
  $$("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === page));
  if (m) pageTournament(m[1]); else ({ home:pageHome, analytics:pageAnalytics, about:pageAbout, contacts:pageContacts, login:pageLogin, admin:pageAdmin })[page]();
  $("#foot").innerHTML = "Данные на " + parseDate(DATA_UPDATED).toLocaleDateString("ru-RU") + ". Проверяйте актуальность на сайтах организаторов. · <a href=\"t/\">Каталог турниров</a>";
  scrollTo(0, 0);
}

/* Переключает тёмную/светлую тему добавлением/удалением CSS-класса dark на <html>. */
function setTheme(dark) {
  document.documentElement.classList.toggle("dark", dark);
  $("#themeBtn").textContent = dark ? "Светлая тема" : "Тёмная тема";
  try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
}
let saved = null;
try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
$("#themeBtn").onclick = () => setTheme(!document.documentElement.classList.contains("dark"));
addEventListener("hashchange", route);
const navToggle = document.getElementById("navToggle"), topNav = document.getElementById("topNav");
const closeTopNav = () => { topNav.classList.remove("open"); navToggle.setAttribute("aria-expanded", "false"); navToggle.setAttribute("aria-label", "Открыть меню"); };
navToggle.onclick = () => { const open = !topNav.classList.contains("open"); topNav.classList.toggle("open", open); navToggle.setAttribute("aria-expanded", String(open)); navToggle.setAttribute("aria-label", open ? "Закрыть меню" : "Открыть меню"); };
topNav.addEventListener("click", e => { if (e.target.closest("a")) closeTopNav(); });
addEventListener("resize", () => { if (innerWidth > 900) closeTopNav(); });

/* Загружает data/faceit.json и data/vk.json независимо друг от друга: если один файл недоступен или повреждён,
   второй всё равно показывается, а при отсутствии обоих сайт работает на ручных данных. */
async function loadJsonFile(url) {
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 5000);
    const res = await fetch(url + "?t=" + Date.now(), { signal: ctl.signal, cache: "no-store" });
    clearTimeout(timer);
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch (e) { console.warn("Данные недоступны (" + url + "):", e); return null; }
}
async function loadStatic() {
  try {
    const data = await loadJsonFile("data/static-tournaments.json");
    TOURNAMENTS = Array.isArray(data && data.tournaments) ? data.tournaments.map(clean).filter(Boolean) : [];
    if (!TOURNAMENTS.length) console.warn("Статический каталог турниров пуст или недоступен.");
  } catch (e) {
    console.warn("Не удалось загрузить статический каталог турниров:", e);
    TOURNAMENTS = [];
  }
}

async function loadRemote() {
  const files = await Promise.all([FACEIT_JSON, VK_JSON].map(loadJsonFile));
  let updated = "";
  REMOTE = [];
  for (const j of files) {
    if (!j) continue;
    if (Array.isArray(j.tournaments)) REMOTE.push(...j.tournaments.map(clean).filter(Boolean));
    if (j.updatedAt && j.updatedAt > updated) updated = j.updatedAt;
  }
  if (updated) DATA_UPDATED = updated.slice(0, 10);
}

/* Запуск: данные FACEIT и ручные турниры грузятся параллельно; состояние входа подхватывается позже и перерисовывает шапку/страницу. */
initSupabase();
renderAuth();
Promise.all([loadStatic(), loadRemote(), loadManual(), loadTournamentOverrides()]).finally(route);
if (SB) {
  SB.auth.getSession().then(async ({ data }) => {
    AUTH.user = data.session ? data.session.user : null; await loadRole(); AUTH.ready = true; renderAuth();
    route();
  });
  // Внутри колбэка нельзя напрямую ждать запросы Supabase (взаимная блокировка), поэтому — через setTimeout.
  SB.auth.onAuthStateChange((_e, session) => setTimeout(async () => {
    AUTH.user = session ? session.user : null; await loadRole(); AUTH.ready = true; renderAuth();
    route();
  }, 0));
} else AUTH.ready = true;
</script>
