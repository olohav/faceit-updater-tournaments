# GitHub Pages is a static mirror only. PHP API and private moderation data are not published here.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Update site data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare public static artifact
        run: |
          mkdir -p public/data public/t
          cp index.html sitemap.xml robots.txt public/
          cp data/faceit.json data/static-tournaments.json public/data/
          if [ -f data/vk.json ]; then cp data/vk.json public/data/; fi
          cp -R t/. public/t/
          touch public/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
