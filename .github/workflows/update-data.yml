name: Update site data

# Один конвейер: тесты -> FACEIT -> ВКонтакте (сбор кандидатов) -> страницы для поисковиков -> коммит -> хостинг по FTP.
# Одобрение ВК-турниров происходит на сайте (moderation.html) и этот workflow не требует: решения пишет api/vk.php на хостинге.
on:
  schedule:
    - cron: "17 * * * *"      # каждый час: FACEIT
    - cron: "23 */6 * * *"    # каждые 6 часов: FACEIT и обход ВК-групп клубов (около 30 минут)
  push:
    branches: [main]
    paths:                    # правки сайта на GitHub сразу уходят на хостинг (без запроса к FACEIT и ВК)
      - "index.html"
      - "moderation.html"
      - "api/**"
      - "lib/**"
      - "site.config.json"
  workflow_dispatch:           # ручной запуск кнопкой "Run workflow"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}      # без этого секрета загрузка на хостинг пропускается
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_DIR: ${{ secrets.FTP_DIR }}            # папка сайта на сервере, например /public_html/
      FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL }}  # ftp (по умолчанию) или ftps
      VK_TOKEN: ${{ secrets.VK_TOKEN }}          # без этого секрета обход ВК пропускается
      FACEIT_API_KEY: ${{ secrets.FACEIT_API_KEY }}
      MODERATOR_PASSWORD: ${{ secrets.MODERATOR_PASSWORD }}  # пароль страницы moderation.html (не короче 10 символов)
      # Что НЕ загружается на хостинг. data/vk*.json пишет api/vk.php на сервере, перезаписывать их нельзя.
      FTP_EXCLUDE: |
        **/.git*
        **/.git*/**
        .github/**
        scripts/**
        supabase/**
        README.md
        package.json
        *.bat
        *.mjs
        site.config.json
        api/*.tmp*
        data/clubs.json
        data/organizers.json
        data/vk.json
        data/vk-decisions.json
        data/vk-skip.json
        data/vk-search-cache.json
        data/vk-unknown-cities.txt
        data/.login-fail.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Автотесты
        run: node --test scripts/test.mjs

      - name: Что обновлять в этом запуске
        id: mode
        run: |
          faceit=1; vk=1
          if [ "${{ github.event_name }}" = "push" ]; then faceit=0; vk=0; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "23 */6 * * *" ]; then vk=0; fi
          echo "faceit=$faceit" >> "$GITHUB_OUTPUT"
          echo "vk=$vk" >> "$GITHUB_OUTPUT"

      # Каждый источник может упасть, не останавливая остальные; в конце запуск всё равно станет красным.
      - name: FACEIT
        id: faceit
        if: steps.mode.outputs.faceit == '1' && env.FACEIT_API_KEY != ''
        continue-on-error: true
        run: node scripts/sync-faceit.mjs

      - name: ВКонтакте, обход групп клубов
        id: vk
        if: steps.mode.outputs.vk == '1' && env.VK_TOKEN != ''
        continue-on-error: true
        run: node scripts/vk-tournaments.mjs

      - name: Страницы для поисковиков
        run: node scripts/build-pages.mjs

      - name: Пароль модератора (api/config.php)
        id: modcfg
        if: env.MODERATOR_PASSWORD != ''
        continue-on-error: true
        run: node scripts/make-moderator-config.mjs

      - name: Коммит, если данные изменились
        run: |
          if [ -n "$(git status --porcelain data/ t/ sitemap.xml robots.txt)" ]; then
            git config user.name "data-sync-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A data t sitemap.xml robots.txt
            git commit -m "Обновление данных турниров"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi

      - name: Загрузка на хостинг по FTP
        id: ftp
        if: env.FTP_SERVER != ''
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || '/' }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          exclude: ${{ env.FTP_EXCLUDE }}

      # Ошибка «550 Can't change directory»: файл состояния выкладки на сервере разошёлся с реальными файлами
      # (что-то удалили вручную). Удаляем файл состояния, и повторная загрузка зальёт всё заново.
      - name: FTP, самовосстановление после сбоя
        id: ftp_heal
        if: env.FTP_SERVER != '' && steps.ftp.outcome == 'failure'
        continue-on-error: true
        run: |
          DIR="${FTP_DIR:-/}"; case "$DIR" in */) ;; *) DIR="$DIR/";; esac
          SSL=""; case "${FTP_PROTOCOL:-ftp}" in ftps*) SSL="--ssl-reqd";; esac
          curl -sS --max-time 60 $SSL -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" -Q "-DELE ${DIR}.ftp-deploy-sync-state.json" -o /dev/null || true
          echo "Файл состояния выкладки сброшен, повторяю загрузку."

      - name: Загрузка на хостинг по FTP (повтор)
        id: ftp_retry
        if: env.FTP_SERVER != '' && steps.ftp.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR || '/' }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          exclude: ${{ env.FTP_EXCLUDE }}

      - name: Итог запуска
        if: always()
        run: |
          fail=0
          [ "${{ steps.faceit.outcome }}" = "failure" ] && { echo "::error::FACEIT завершился с ошибкой"; fail=1; }
          [ "${{ steps.vk.outcome }}" = "failure" ] && { echo "::error::Обход ВКонтакте завершился с ошибкой"; fail=1; }
          [ "${{ steps.modcfg.outcome }}" = "failure" ] && { echo "::error::Пароль модератора не применён: проверьте секрет MODERATOR_PASSWORD (не короче 10 символов)"; fail=1; }
          if [ "${{ steps.ftp.outcome }}" = "failure" ] && [ "${{ steps.ftp_retry.outcome }}" != "success" ]; then echo "::error::Загрузка на хостинг не удалась даже после повтора"; fail=1; fi
          [ "${{ steps.ftp.outcome }}" = "failure" ] && [ "${{ steps.ftp_retry.outcome }}" = "success" ] && echo "::warning::FTP восстановился после сброса состояния выкладки"
          exit $fail
